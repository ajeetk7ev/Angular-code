<div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
  <!-- Card Container -->
  <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8 w-full max-w-sm text-center">
    
    <!-- Label & Value -->
    <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Current Value</p>
    <p class="text-5xl font-bold text-slate-100 mb-8 tabular-nums">{{value}}</p>
    
    <!-- Controls -->
    <div class="flex flex-row items-center justify-center gap-4">
      <button
       (click) = "decrement()"
       class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-4 rounded-xl transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 focus:ring-offset-slate-800">
        Decrement
      </button>
      
      <button 
       (click) = "increment()"
      class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 px-4 rounded-xl transition-colors duration-200 shadow-lg shadow-indigo-500/30 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800">
        Increment
      </button>
    </div>
    
  </div>
</div>
