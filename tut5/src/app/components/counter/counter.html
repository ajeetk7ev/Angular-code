
<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-4">
        <span class="text-3xl font-bold">#</span>
      </div>

      <h1 class="text-2xl font-bold text-white">
        Counter App
      </h1>

      <p class="text-sm text-slate-400 mt-2">
        Manage your count with ease
      </p>
    </div>

    <!-- Counter Display -->
    <div class="bg-slate-800/70 border border-slate-700 rounded-2xl py-8 px-4 text-center mb-8">
      <p class="text-sm uppercase tracking-[0.2em] text-slate-400 mb-3">
        Current Count
      </p>

      <p class="text-6xl font-extrabold text-white tabular-nums">
        {{ counter.count() }}
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">

      <button
        (click)="counter.increment()"
        class="flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 px-4 py-3.5 text-sm font-semibold text-white transition-all duration-200">
        <span class="text-lg">+</span>
        Increment
      </button>

      <button
        (click)="counter.decrement()"
        class="flex items-center justify-center gap-2 rounded-xl bg-rose-600 hover:bg-rose-500 active:scale-95 px-4 py-3.5 text-sm font-semibold text-white transition-all duration-200">
        <span class="text-lg">−</span>
        Decrement
      </button>

      <button
        (click)="counter.reset()"
        class="col-span-2 flex items-center justify-center gap-2 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 active:scale-95 px-4 py-3.5 text-sm font-semibold text-slate-200 transition-all duration-200">
        <span>↻</span>
        Reset Counter
      </button>

    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 mt-6">
      Built with Angular Signals & Tailwind CSS
    </p>

  </div>
</div>
