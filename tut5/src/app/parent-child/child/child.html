
<div class="max-w-md mx-auto mt-10 p-6 bg-slate-900 border border-slate-700 rounded-2xl shadow-xl text-white ">

  <div class="flex items-center gap-4 mb-6">
    <div class="w-14 h-14 flex items-center justify-center rounded-full bg-indigo-600 text-2xl font-bold">
      {{ student()?.name?.charAt(0) }}
    </div>

    <div>
      <h2 class="text-xl font-bold">Student Profile</h2>
      <p class="text-sm text-slate-400">Student Information</p>
    </div>
  </div>

  <div class="space-y-4">

    <div class="p-3 bg-slate-800 rounded-lg">
      <p class="text-sm text-slate-400 mb-1">Full Name</p>
      <p class="font-medium">{{ student()?.name }}</p>
    </div>

    <div class="p-3 bg-slate-800 rounded-lg">
      <p class="text-sm text-slate-400 mb-1">Email Address</p>
      <p class="font-medium break-all">{{ student()?.email }}</p>
    </div>

    <div class="p-3 bg-slate-800 rounded-lg">
      <p class="text-sm text-slate-400 mb-1">Age</p>
      <p class="font-medium">{{ student()?.age }} years</p>
    </div>

  </div>

  <button
    (click)="selectStudent()"
    class="w-full mt-6 px-4 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/20">
    Select Student
  </button>

</div>
